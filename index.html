<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>خِدمة | منشأة الدهب القبلية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --g950:#022c22;
    --g900:#064e3b;
    --g800:#065f46;
    --g700:#047857;
    --g600:#059669;
    --g500:#10b981;
    --g400:#34d399;
    --g300:#6ee7b7;
    --g200:#a7f3d0;
    --g100:#d1fae5;
    --g50:#ecfdf5;

    --dark:#10231c;
    --muted:#70827a;
    --border:#e4eee9;
    --bg:#f7faf8;
    --white:#fff;

    --shadow:0 8px 25px rgba(6,78,59,.07);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#031b14;
    font-family:'Tajawal',sans-serif;
    color:var(--dark);
}

button,input{
    font-family:inherit;
}

button,a{
    -webkit-tap-highlight-color:transparent;
}

.app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    margin:auto;
    background:var(--bg);
    position:relative;
    overflow:hidden;
}

.screen{
    min-height:100vh;
    padding-bottom:88px;
}

/* ================= HEADER ================= */

.header{
    padding:18px 18px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:47px;
    height:47px;
    border-radius:16px;
    background:linear-gradient(145deg,var(--g400),var(--g800));
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-family:'Cairo';
    font-size:22px;
    font-weight:900;
    box-shadow:0 8px 20px rgba(5,150,105,.22);
}

.brand h1{
    font-family:'Cairo';
    font-size:20px;
    font-weight:900;
    line-height:1.1;
}

.brand p{
    margin-top:3px;
    color:var(--muted);
    font-size:10px;
    font-weight:700;
}

.location{
    width:42px;
    height:42px;
    border-radius:14px;
    background:#fff;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--g700);
}

.location svg{
    width:20px;
    height:20px;
}

/* ================= HERO ================= */

.hero{
    margin:8px 18px 20px;
    padding:23px 20px;
    min-height:166px;
    border-radius:25px;
    color:white;
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 90% 15%,rgba(110,231,183,.22),transparent 28%),
        radial-gradient(circle at 5% 100%,rgba(52,211,153,.20),transparent 30%),
        linear-gradient(135deg,var(--g950),var(--g700));
    
    box-shadow:0 18px 35px rgba(6,78,59,.20);
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border-radius:20px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.12);
    color:#d1fae5;
    font-size:10px;
    font-weight:800;
    margin-bottom:10px;
}

.hero h2{
    font-family:'Cairo';
    font-size:23px;
    font-weight:900;
    line-height:1.35;
}

.hero p{
    margin-top:6px;
    color:#c8f7e5;
    font-size:11px;
    line-height:1.7;
    max-width:290px;
}

.hero-decoration{
    position:absolute;
    left:-30px;
    bottom:-65px;
    width:165px;
    height:165px;
    border:28px solid rgba(255,255,255,.055);
    border-radius:50%;
}

.hero-decoration:after{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    border:13px solid rgba(255,255,255,.04);
    border-radius:50%;
    right:-90px;
    top:-55px;
}

/* ================= SEARCH ================= */

.search-box{
    margin:0 18px 25px;
    height:54px;
    padding:0 15px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:17px;
    box-shadow:var(--shadow);
}

.search-box svg{
    width:20px;
    height:20px;
    color:var(--g700);
    flex-shrink:0;
}

.search-box input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    color:var(--dark);
    font-size:13px;
}

.search-box input::placeholder{
    color:#9aa9a2;
}

/* ================= SECTION ================= */

.section{
    margin-bottom:27px;
}

.section-head{
    padding:0 18px 13px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.section-head h2{
    font-family:'Cairo';
    font-size:16px;
    font-weight:900;
}

.section-head span{
    color:var(--g700);
    font-size:10px;
    font-weight:800;
}

/* ================= SERVICES ================= */

.services{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    padding:0 18px;
}

.service{
    text-align:center;
    cursor:pointer;
}

.service-icon{
    aspect-ratio:1;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#fff,var(--g50));
    border:1px solid var(--g100);
    color:var(--g700);
    box-shadow:0 6px 15px rgba(6,78,59,.055);
    transition:.15s;
}

.service-icon svg{
    width:25px;
    height:25px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.service-name{
    display:block;
    margin-top:7px;
    font-size:10px;
    font-weight:800;
}

.service.active .service-icon{
    background:linear-gradient(145deg,var(--g500),var(--g800));
    color:#fff;
    border-color:transparent;
    box-shadow:0 8px 18px rgba(5,150,105,.20);
}

.service:active .service-icon{
    transform:scale(.94);
}

/* ================= TECHNICIANS ================= */

.technicians{
    padding:0 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.tech-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:21px;
    padding:15px;
    box-shadow:var(--shadow);
}

.tech-main{
    display:flex;
    align-items:center;
    gap:12px;
}

.tech-avatar{
    width:55px;
    height:55px;
    border-radius:17px;
    flex-shrink:0;
    background:linear-gradient(145deg,var(--g400),var(--g800));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cairo';
    font-size:17px;
    font-weight:900;
    box-shadow:0 6px 13px rgba(5,150,105,.16);
}

.tech-info{
    flex:1;
    min-width:0;
}

.tech-info h3{
    font-family:'Cairo';
    font-size:14px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.tech-service{
    color:var(--g700);
    font-size:11px;
    font-weight:800;
    margin-top:2px;
}

.tech-location{
    display:flex;
    align-items:center;
    gap:3px;
    color:var(--muted);
    font-size:10px;
    margin-top:4px;
}

.rating{
    background:#fffbeb;
    color:#a16207;
    padding:5px 7px;
    border-radius:8px;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
}

.tech-details{
    margin-top:13px;
    padding-top:12px;
    border-top:1px solid #f0f4f2;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.price{
    color:var(--muted);
    font-size:10px;
}

.price strong{
    color:var(--g700);
    font-family:'Cairo';
    font-size:14px;
}

.actions{
    display:flex;
    gap:7px;
}

.action{
    text-decoration:none;
    border:0;
    border-radius:11px;
    padding:9px 12px;
    font-size:10px;
    font-weight:900;
    display:flex;
    align-items:center;
    gap:5px;
}

.action svg{
    width:14px;
    height:14px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
}

.call{
    background:var(--g700);
    color:#fff;
}

.whatsapp{
    background:#e9fff4;
    color:#07814f;
}

/* ================= EMPTY ================= */

.empty{
    margin:0 18px;
    padding:31px 20px;
    text-align:center;
    background:#fff;
    border:1px dashed var(--border);
    border-radius:19px;
    color:var(--muted);
    font-size:12px;
    line-height:1.8;
}

.empty-icon{
    width:48px;
    height:48px;
    margin:0 auto 9px;
    border-radius:15px;
    background:var(--g50);
    color:var(--g700);
    display:flex;
    align-items:center;
    justify-content:center;
}

.empty-icon svg{
    width:23px;
    height:23px;
}

/* ================= LOADING ================= */

.loading{
    padding:30px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    height:70px;
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:20;
}

.nav-item{
    min-width:70px;
    text-align:center;
    color:#8b9a93;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
}

.nav-item.active{
    color:var(--g700);
}

.nav-icon{
    width:21px;
    height:21px;
    margin:0 auto 4px;
    display:block;
}

.nav-icon svg{
    width:21px;
    height:21px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.9;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* ================= DESKTOP ================= */

@media(min-width:481px){

    .app{
        box-shadow:0 0 70px rgba(0,0,0,.30);
    }
}
</style>
</head>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD4dDmuwC2qwL25O_Oi2jAOiVPD3QluaRQ",

    authDomain:
        "khedma-4e607.firebaseapp.com",

    projectId:
        "khedma-4e607",

    storageBucket:
        "khedma-4e607.firebasestorage.app",

    messagingSenderId:
        "541874029326",

    appId:
        "1:541874029326:web:41c7154c184f70dcce4d5f",

    measurementId:
        "G-WWB14VL9G3"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* ================= DATA ================= */

let technicians = [];

let selectedService = "";


/* ================= LOAD ================= */

async function loadTechnicians(){

    const container =
        document.getElementById("technicians");

    try{

        const snapshot =
            await getDocs(
                collection(db,"technicians")
            );


        technicians = [];


        snapshot.forEach(item => {

            const data = item.data();


            /*
             * العميل يرى الفنيين المتاحين فقط
             */

            if(data.active === true){

                technicians.push({

                    id:item.id,
                    ...data

                });

            }

        });


        renderTechnicians(technicians);


    }catch(error){

        console.error(error);


        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 8v4"/>
                        <path d="M12 16h.01"/>
                    </svg>

                </div>

                تعذر تحميل الفنيين.
                <br>
                حاول مرة أخرى.

            </div>

        `;

    }

}


/* ================= RENDER ================= */

function renderTechnicians(list){

    const container =
        document.getElementById("technicians");


    document.getElementById("technicianCount").textContent =
        `${list.length} فني`;


    if(list.length === 0){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">

                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 21a8 8 0 0 1 16 0"/>
                    </svg>

                </div>

                لا يوجد فني متاح حاليًا لهذه الخدمة.

            </div>

        `;

        return;

    }


    container.innerHTML =
        list.map(tech => createCard(tech)).join("");

}


/* ================= CARD ================= */

function createCard(tech){

    const name =
        escapeHTML(tech.name || "فني");


    const service =
        escapeHTML(tech.service || "");


    const governorate =
        escapeHTML(
            tech.governorate || "منشأة الدهب القبلية"
        );


    const area =
        escapeHTML(tech.area || "");


    const phone =
        String(tech.phone || "")
        .replace(/[^\d+]/g,"");


    const rating =
        tech.rating ?? 5;


    const initials =
        getInitials(tech.name);


    let price =
        "السعر حسب الخدمة";


    if(tech.price){

        price =
            `يبدأ من <strong>${escapeHTML(
                String(tech.price)
            )} ج.م</strong>`;

    }


    const whatsappNumber =
        phone.replace(/^0/,"20");


    const whatsappMessage =
        encodeURIComponent(
            `مرحباً ${tech.name || ""}، أريد الاستفسار عن خدمة ${tech.service || ""} من خلال منصة خِدمة.`

    return `

                            <circle cx="12" cy="10" r="2.5"/>
                        </svg>

                        ${governorate}
                        ${area ? " - " + area : ""}

                    </div>

                </div>


                <div class="rating">
                    ⭐ ${escapeHTML(String(rating))}
                </div>

            </div>


            <div class="tech-details">

                <div class="price">

                        <svg viewBox="0 0 24 24">

                        </svg>

                        اتصال

                    </a>


                    <a
                        class="action whatsapp"
                        href="https://wa.me/${whatsappNumber}?text=${whatsappMessage}"
                        target="_blank"
                        rel="noopener"
                        aria-label="واتساب"
                    >

                        <svg viewBox="0 0 24 24">
                            <path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5Z"/>
                            <path d="M8.5 8.5c.3 1.8 2.2 3.7 4 4 .6.1 1-.1 1.3-.6l.4-.7"/>
                        </svg>

                        واتساب

                    </a>

                </div>

            </div>

        </article>

    `;

}


/* ================= SEARCH ================= */

document
.getElementById("searchInput")
.addEventListener("input",function(){

    const query =
        this.value
        .trim()
        .toLowerCase();


    if(!query){

        selectedService = "";

        document.getElementById("serviceResult").textContent =
            "جميع الخدمات";

        document.getElementById("techniciansTitle").textContent =
            "الفنيين المتاحين";

        document
        .querySelectorAll(".service")
        .forEach(item =>
            item.classList.remove("active")
        );

        renderTechnicians(technicians);

        return;

    }


    const filtered =
        technicians.filter(tech => {

            const text = [

                tech.name || "",
                tech.service || "",
                tech.governorate || "",
                tech.area || ""

            ]
            .join(" ")
            .toLowerCase();


            return text.includes(query);

        });


    document.getElementById("serviceResult").textContent =
        `نتائج البحث`;


    document.getElementById("techniciansTitle").textContent =
        `نتائج البحث`;


    renderTechnicians(filtered);

});


/* ================= SERVICE FILTER ================= */

document
.querySelectorAll(".service")
.forEach(service => {

    service.addEventListener("click",function(){

        const serviceName =
            this.dataset.service;


        selectedService =
            serviceName;


        document
        .getElementById("searchInput")
        .value = "";


        document
        .querySelectorAll(".service")
        .forEach(item =>
            item.classList.remove("active")
        );


        this.classList.add("active");


        const filtered =
            technicians.filter(tech => {

                const current =
                    String(tech.service || "")
                    .trim()
                    .toLowerCase();

                const wanted =
                    serviceName
                    .trim()
                    .toLowerCase();

                return current === wanted;

            });


        document.getElementById("serviceResult").textContent =
            serviceName;


        document.getElementById("techniciansTitle").textContent =
            `فنيين ${serviceName}`;


        renderTechnicians(filtered);


        scrollToTechnicians();

    });

});


/* ================= NAVIGATION ================= */

window.goHome = function(element){

    document
    .querySelectorAll(".nav-item")
    .forEach(item =>
        item.classList.remove("active")
    );

    element.classList.add("active");

    document.getElementById("screen")
    .scrollTo({
        top:0,
        behavior:"smooth"
    });

};


window.scrollToServices = function(element){

    document
    .querySelectorAll(".nav-item")
    .forEach(item =>
        item.classList.remove("active")
    );

    element.classList.add("active");


    document
    .getElementById("servicesSection")
    .scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

};


window.scrollToTechnicians = function(element){

    if(element){

        document
        .querySelectorAll(".nav-item")
        .forEach(item =>
            item.classList.remove("active")
        );

        element.classList.add("active");

    }


    document
    .getElementById("techniciansSection")
    .scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

};


/* ================= HELPERS ================= */

function getInitials(name){

    if(!name){
        return "خ";
    }


    const parts =
        String(name)
        .trim()
        .split(/\s+/);


    if(parts.length >= 2){

        return (
            parts[0][0] +
            parts[1][0]
        );

    }


    return String(name).substring(0,2);

}


function escapeHTML(value){

    return String(value)

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

loadTechnicians();
